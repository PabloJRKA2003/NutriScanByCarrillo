<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NutriScan Pro - Full Investor Demo</title>
  <style>
    :root {
      --bg-primary: #090d16;
      --card-bg: #151c2c;
      --accent-blue: #2563eb;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-orange: #f97316;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #243048;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding-bottom: 90px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header iOS Style */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background: rgba(37, 99, 235, 0.2);
      color: var(--accent-cyan);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Generic Cards */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Dynamic Rings / Macros Section */
    .rings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
    }

    .ring-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto;
    }

    .ring-container svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: #1e293b;
      stroke-width: 10;
    }

    .ring-progress {
      fill: none;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease;
    }

    .ring-kcal { stroke: var(--accent-orange); }
    .ring-protein { stroke: var(--accent-cyan); }
    .ring-carbs { stroke: var(--accent-green); }

    .ring-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .ring-center-text .val {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .ring-center-text .lbl {
      font-size: 0.7rem;
      color: var(--text-sub);
    }

    .macro-bars {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .macro-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .macro-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .bar-bg {
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Scanner & Camera Module */
    .scanner-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s;
    }

    video.espejo {
      transform: scaleX(-1);
    }

    .scan-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      margin: 18px;
      border-radius: 12px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-overlay span {
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--text-sub);
      backdrop-filter: blur(4px);
    }

    .controls-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary { background-color: #243048; color: var(--text-main); }
    .btn-primary { background-color: var(--accent-green); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }

    .status-text {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
    }

    .preview-box {
      margin-top: 14px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .preview-box img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--accent-cyan);
    }

    /* Editable Pantry List */
    .pantry-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .pantry-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #1a2336;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .pantry-item-info h4 {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .pantry-item-info p {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--accent-red);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* TDEE Calculator Controls */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .input-group input, .input-group select {
      background: #1a2336;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>NutriScan Pro</h1>
      <span class="badge">iOS 18 Investor Demo</span>
    </header>

    <!-- Daily Progress & Activity Rings -->
    <section class="card">
      <div class="card-title">
        <span>🔥 Resumen Diario</span>
        <button id="btnResetDemo" class="btn btn-danger" style="padding: 4px 10px; font-size: 0.75rem;">Reiniciar Demo</button>
      </div>

      <div class="rings-grid">
        <div class="ring-container">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
            <circle id="ringKcal" class="ring-progress ring-kcal" cx="50" cy="50" r="45" stroke-dashwidth="283"></circle>
          </svg>
          <div class="ring-center-text">
            <div id="kcalVal" class="val">0</div>
            <div class="lbl">/ 2,200 kcal</div>
          </div>
        </div>

        <div class="macro-bars">
          <div class="macro-row">
            <div class="macro-info">
              <span>Proteínas</span>
              <span id="protTxt">0 / 160g</span>
            </div>
            <div class="bar-bg"><div id="barProt" class="bar-fill" style="background: var(--accent-cyan);"></div></div>
          </div>

          <div class="macro-row">
            <div class="macro-info">
              <span>Carbohidratos</span>
              <span id="carbTxt">0 / 220g</span>
            </div>
            <div class="bar-bg"><div id="barCarb" class="bar-fill" style="background: var(--accent-green);"></div></div>
          </div>

          <div class="macro-row">
            <div class="macro-info">
              <span>Grasas</span>
              <span id="fatTxt">0 / 70g</span>
            </div>
            <div class="bar-bg"><div id="barFat" class="bar-fill" style="background: var(--accent-orange);"></div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Camera / OCR Scanner -->
    <section class="card">
      <div class="card-title">
        <span>📸 Escáner OCR en Vivo</span>
      </div>

      <div class="scanner-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-overlay">
          <span>Apunta a la tabla nutricional</span>
        </div>
      </div>

      <div class="controls-row">
        <button id="btnCambiar" class="btn btn-secondary">🔄 Lente</button>
        <button id="btnCapturar" class="btn btn-primary">📷 Escanear Producto</button>
      </div>

      <p id="status" class="status-text">Detectando sensores del teléfono...</p>

      <div id="previewContainer" class="preview-box">
        <span style="font-size: 0.75rem; color: var(--accent-cyan);">Último ítem procesado:</span>
        <img id="fotoPreview" alt="Captura OCR">
      </div>
    </section>

    <!-- Editable Pantry System -->
    <section class="card">
      <div class="card-title">
        <span>📦 Despensa & Registros</span>
        <span id="itemCount" style="font-size: 0.8rem; color: var(--text-sub);">3 ítems</span>
      </div>

      <div id="pantryContainer" class="pantry-list">
        <!-- Inyectado dinámicamente -->
      </div>
    </section>

    <!-- Biometric Calculator (TDEE) -->
    <section class="card">
      <div class="card-title">
        <span>⚙️ Configuración TDEE / Metas</span>
      </div>
      <div class="input-group">
        <label for="goalSelect">Objetivo Calórico</label>
        <select id="goalSelect">
          <option value=" deficit">Déficit Calórico (-20%)</option>
          <option value="mantenimiento" selected>Mantenimiento</option>
          <option value="volumen">Volumen / Superávit (+15%)</option>
        </select>
      </div>
    </section>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    // --- ESTADO INICIAL DE LA DEMO (Zero-State para inversores) ---
    let logActual = { kcal: 0, prot: 0, carb: 0, fat: 0 };
    const metas = { kcal: 2200, prot: 160, carb: 220, fat: 70 };

    let despensa = [
      { id: 1, nombre: "Avena Integral", kcal: 380, prot: 13, carb: 68, fat: 7 },
      { id: 2, nombre: "Pechuga de Pollo", kcal: 165, prot: 31, carb: 0, fat: 3.6 },
      { id: 3, nombre: "Yogur Griego 0%", kcal: 59, prot: 10, carb: 4, fat: 0.4 }
    ];

    // --- ACTUALIZACIÓN DE UI Y ANILLOS ---
    function actualizarRings() {
      document.getElementById('kcalVal').innerText = logActual.kcal;
      const pctKcal = Math.min(logActual.kcal / metas.kcal, 1);
      const dashoffset = 283 - (283 * pctKcal);
      document.getElementById('ringKcal').style.strokeDashoffset = dashoffset;

      document.getElementById('protTxt').innerText = `${logActual.prot} / ${metas.prot}g`;
      document.getElementById('barProt').style.width = `${Math.min((logActual.prot / metas.prot) * 100, 100)}%`;

      document.getElementById('carbTxt').innerText = `${logActual.carb} / ${metas.carb}g`;
      document.getElementById('barCarb').style.width = `${Math.min((logActual.carb / metas.carb) * 100, 100)}%`;

      document.getElementById('fatTxt').innerText = `${logActual.fat} / ${metas.fat}g`;
      document.getElementById('barFat').style.width = `${Math.min((logActual.fat / metas.fat) * 100, 100)}%`;
    }

    function renderDespensa() {
      const container = document.getElementById('pantryContainer');
      container.innerHTML = '';
      document.getElementById('itemCount').innerText = `${despensa.length} ítems`;

      despensa.forEach(item => {
        const div = document.createElement('div');
        div.className = 'pantry-item';
        div.innerHTML = `
          <div class="pantry-item-info">
            <h4>${item.nombre}</h4>
            <p>${item.kcal} kcal | P: ${item.prot}g C: ${item.carb}g G: ${item.fat}g</p>
          </div>
          <button class="delete-btn" onclick="eliminarItem(${item.id})">🗑️</button>
        `;
        container.appendChild(div);
      });
    }

    function eliminarItem(id) {
      despensa = despensa.filter(i => i.id !== id);
      renderDespensa();
    }

    document.getElementById('btnResetDemo').addEventListener('click', () => {
      logActual = { kcal: 0, prot: 0, carb: 0, fat: 0 };
      actualizarRings();
      document.getElementById('previewContainer').style.display = 'none';
    });

    // --- LÓGICA DE CÁMARA ROBUSTA PARA IPHONE ---
    const video = document.getElementById('webcam');
    const btnCambiar = document.getElementById('btnCambiar');
    const btnCapturar = document.getElementById('btnCapturar');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const fotoPreview = document.getElementById('fotoPreview');
    const previewContainer = document.getElementById('previewContainer');

    let streamActual = null;
    let dispositivosVideo = [];
    let indiceCamaraActual = 0;

    async function obtenerCamaras() {
      try {
        const primerStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        primerStream.getTracks().forEach(t => t.stop());

        const dispositivos = await navigator.mediaDevices.enumerateDevices();
        dispositivosVideo = dispositivos.filter(d => d.kind === 'videoinput');

        if (dispositivosVideo.length === 0) {
          statusText.innerText = "No se detectó cámara física.";
          return;
        }

        let indiceTrasera = dispositivosVideo.findIndex(d => 
          d.label.toLowerCase().includes('back') || 
          d.label.toLowerCase().includes('trasera') ||
          d.label.toLowerCase().includes('environment')
        );

        indiceCamaraActual = (indiceTrasera !== -1) ? indiceTrasera : (dispositivosVideo.length - 1);
        iniciarCamaraPorId(dispositivosVideo[indiceCamaraActual].deviceId);
      } catch (err) {
        console.error(err);
        statusText.innerText = "Acceso a la cámara denegado.";
      }
    }

    async function iniciarCamaraPorId(deviceId) {
      if (streamActual) streamActual.getTracks().forEach(t => t.stop());

      try {
        streamActual = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        aplicarStream(streamActual);
      } catch (e) {
        navigator.mediaDevices.getUserMedia({ video: { deviceId: deviceId }, audio: false })
          .then(s => { streamActual = s; aplicarStream(s); })
          .catch(() => statusText.innerText = "Error cargando lente.");
      }
    }

    function aplicarStream(stream) {
      video.srcObject = stream;
      const track = stream.getVideoTracks()[0];
      const label = track.label.toLowerCase();
      const esFrontal = label.includes('front') || label.includes('user');

      if (esFrontal) video.classList.add('espejo');
      else video.classList.remove('espejo');

      const config = track.getSettings();
      statusText.innerText = `Cámara Lista: ${track.label || 'Sensor'} (${config.width || 1280}x${config.height || 720}px)`;
      statusText.style.color = "#10b981";
    }

    btnCambiar.addEventListener('click', () => {
      if (dispositivosVideo.length <= 1) return;
      indiceCamaraActual = (indiceCamaraActual + 1) % dispositivosVideo.length;
      statusText.innerText = "Cambiando lente...";
      iniciarCamaraPorId(dispositivosVideo[indiceCamaraActual].deviceId);
    });

    btnCapturar.addEventListener('click', () => {
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      if (video.classList.contains('espejo')) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      fotoPreview.src = canvas.toDataURL('image/png');
      previewContainer.style.display = 'flex';

      // Simulador de OCR: Suma un alimento procesado al log
      logActual.kcal += 240;
      logActual.prot += 20;
      logActual.carb += 30;
      logActual.fat += 5;
      actualizarRings();

      statusText.innerText = "¡OCR Escaneado: +240 kcal agregadas!";
    });

    // Inicializar app
    actualizarRings();
    renderDespensa();
    obtenerCamaras();
  </script>
</body>
</html>
