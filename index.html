<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara Web en Alta Resolución</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background-color: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    video {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      /* Efecto espejo para selfies */
      transform: scaleX(-1);
      /* Optimización de nitidez */
      image-rendering: -webkit-optimize-contrast;
    }

    .info-status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>Vista de Cámara</h1>
    
    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
    </div>

    <p id="status" class="info-status">Cargando cámara...</p>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');

    // Configuración para pedir Alta Resolución (Full HD / HD)
    const opcionesCamaraHD = {
      video: {
        width: { min: 1280, ideal: 1920 },
        height: { min: 720, ideal: 1080 },
        frameRate: { ideal: 30, max: 60 },
        facingMode: "user"
      },
      audio: false
    };

    async function iniciarCamara() {
      try {
        // Intentar cargar cámara en alta resolución
        const stream = await navigator.mediaDevices.getUserMedia(opcionesCamaraHD);
        aplicarStream(stream);
      } catch (err) {
        console.warn("No se pudo iniciar en HD, cargando modo estándar compatible:", err);
        intentarCamaraEstandar();
      }
    }

    function intentarCamaraEstandar() {
      // Respaldo en resolución estándar si el dispositivo no soporta HD
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
          aplicarStream(stream);
        })
        .catch(err => {
          console.error("Error definitivo al acceder a la cámara:", err);
          statusText.innerText = "Error: No se pudo acceder a la cámara. Revisa los permisos.";
          statusText.style.color = "#f87171";
        });
    }

    function aplicarStream(stream) {
      video.srcObject = stream;
      
      const track = stream.getVideoTracks()[0];
      const config = track.getSettings();
      
      if (config.width && config.height) {
        statusText.innerText = `Cámara activa (${config.width}x${config.height} px)`;
      } else {
        statusText.innerText = "Cámara activa";
      }
    }

    // Iniciar cámara al cargar la página
    iniciarCamara();
  </script>

</body>
</html>
